name: Weekly build

on:
  schedule:
    - cron: "0 3 * * 0" # every Sunday 03:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if this version was already released"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: weekly-build

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      # Fail in seconds on a bad token / chat id, not after a 2h build.
      - name: Check Telegram access
        run: |
          set -o pipefail
          # getChat succeeds for any public channel; posting needs the bot to be an admin
          curl -sS --fail-with-body "https://api.telegram.org/bot${TG_TOKEN}/getChatMember" \
            --form-string "chat_id=${TG_CHAT}" --form-string "user_id=${TG_TOKEN%%:*}" \
            | jq -e -c '{ok, description, status: .result.status} | ., (.status == "administrator")'

      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          docker image prune -af
          df -h /

      - name: Build kernel
        run: |
          docker build -t pantah-kernel .
          mkdir -p output && chmod 777 output  # container runs as non-root 'builder'
          docker run --rm -v "$PWD/output:/workspace/output" pantah-kernel
          df -h /
          ls -la output

      - name: Check if already released
        id: ver
        run: |
          ZIP=$(ls output/*-AnyKernel3.zip | head -1)
          TAG=$(basename "$ZIP" -AnyKernel3.zip)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1 && [ "${{ inputs.force }}" != "true" ]; then
            echo "$TAG already released, nothing new upstream - skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: BakaSU changelog
        id: log
        if: steps.ver.outputs.skip != 'true'
        run: |
          NEW=$(cat output/bakasu_sha.txt 2>/dev/null || true)
          # previous release body carries "BakaSU: <sha>" (written below)
          PREV=$(gh api "repos/${{ github.repository }}/releases" \
            --jq '[.[] | select(.tag_name != "${{ steps.ver.outputs.tag }}")][0].body // ""' \
            | grep -oP 'BakaSU: \K[0-9a-f]+' | head -1 || true)
          echo "BakaSU: ${NEW:-unknown}" > changelog.txt
          if [ -n "$NEW" ] && [ -n "$PREV" ] && [ "$NEW" != "$PREV" ]; then
            CMP="https://github.com/Baka-SU/BakaSU/compare/${PREV}...${NEW}"
            echo "cmp=$CMP" >> "$GITHUB_OUTPUT"
            gh api "repos/Baka-SU/BakaSU/compare/${PREV}...${NEW}" --jq '.commits[].commit.message | split("\n")[0]' \
              | grep -viE 'update translations|clang-format' | tac > commits.txt || true
          fi
          touch commits.txt
          cat changelog.txt commits.txt

      - name: Create GitHub release
        if: steps.ver.outputs.skip != 'true'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          {
            echo "Automated weekly build ($(date -u +%F)). Flash the AnyKernel3 zip with a kernel flasher, or the boot.img via fastboot (see README)."
            echo
            cat changelog.txt
            if [ -s commits.txt ]; then
              echo; echo "### BakaSU changes"; sed 's/^/- /' commits.txt
              echo; echo "[Full diff](${{ steps.log.outputs.cmp }})"
            fi
          } > notes.md
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true  # only hit on force
          gh release create "$TAG" output/*.zip output/*-boot.img output/vbmeta.img \
            --title "$TAG" --notes-file notes.md

      - name: Post to Telegram
        if: steps.ver.outputs.skip != 'true'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG}"
          # Bot API upload limit is 50 MB: zip (~18 MB) is attached, boot.img (64 MiB) only linked.
          curl -sS --fail-with-body "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" \
            --form-string "chat_id=${TG_CHAT}" \
            --form-string "parse_mode=HTML" \
            --form-string "caption=<b>${TAG}</b>
          Pixel 7 / 7 Pro (pantah), $(date -u +%F)

          boot.img + vbmeta: <a href=\"${URL}\">GitHub release</a>" \
            -F "document=@${{ steps.ver.outputs.zip }}"

          # Changelog as a separate message: document captions are capped at 1024 chars.
          if [ -s commits.txt ]; then
            # shortcut: long changelogs are cut at 40 lines, the diff link has the rest
            TEXT="<b>BakaSU changes</b>
          $(head -n 40 commits.txt | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/^/• /')

          <a href=\"${{ steps.log.outputs.cmp }}\">Full diff</a>"
            curl -sS --fail-with-body "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --form-string "chat_id=${TG_CHAT}" \
              --form-string "parse_mode=HTML" \
              --form-string "disable_web_page_preview=true" \
              --form-string "text=${TEXT}" >/dev/null
          fi
